ansible_ssh_private_key_file: ~/.ssh/id_ed25519
ansible_become: yes

# proxmox
k3s_node_ip: "{{ hostvars['k3s-node']['ansible_host'] }}"
lxc_monitoring_ip: "{{ hostvars['lxc-monitoring']['ansible_host'] }}"

# nas
nfs_server: "{{ hostvars['truenas']['ansible_host'] }}"

grafana_port: 3000
grafana_admin_user: admin

loki_version: "3.7.9"
loki_port: 3100
# Logs mais velhos que isso são apagados pelo compactor
loki_retention_period: 336h # 14 dias

# Prometheus (pacote do Debian): o que vencer primeiro, tempo ou tamanho.
# Em 2026-11-11 eram 893 MB com 15 dias; o tamanho segura o disco de 20 GB quando entrarem mais alvos.
prometheus_retention_time: 30d
prometheus_retention_size: 8GB

# Alertmanager (pacote prometheus-alertmanager do Debian), mesma LXC do Prometheus.
alertmanager_port: 9093
# Limiares das regras em alert.rules.yml.j2
alert_instance_down_for: 2m
alert_disk_warning_pct: 80
alert_disk_critical_pct: 90
alert_memory_pct: 90

# pi4
pi4_ip: "{{ hostvars['pi4']['ansible_host'] }}"

omada_port: 8043

upsnap_version: "5.3.1"
upsnap_port: 8090

motioneye_port: 8765

# forgejo
forgejo_ip: "{{ hostvars['forgejo']['ansible_host'] }}"
forgejo_version: "15.0.11"
forgejo_domain: "git.lflab.cc"
forgejo_http_port: 3000
forgejo_ssh_port: 2222
forgejo_dump_keep: 14
# forgejo-runner (Actions), executor host na propria LXC; releases em code.forgejo.org/forgejo/runner
forgejo_runner_version: "13.2.1"
# LXCs de site que recebem rsync dos workflows (dash-infra): host keys gravadas no known_hosts do runner
forgejo_runner_deploy_hosts: ["10.10.10.90", "10.10.10.92"]
