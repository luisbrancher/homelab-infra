---

- name: Configure k3s-node
  hosts: k3s-node                # hosts do inventory que se aplica
  become: true                   # sudo

  pre_tasks:
    # apt-get update
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600  # só atualiza se o cache tiver mais de 1h


  tasks:
  # NFS client
    - name: Install NFS client
      ansible.builtin.apt:
        name: nfs-common
        state: present

    # media SSD (dedicated Jellyfin storage)
    - name: Install parted
      ansible.builtin.apt:
        name: parted
        state: present
      tags: media

    - name: Create partition on media SSD
      community.general.parted:
        device: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1
        number: 1
        state: present
        fs_type: ext4
      tags: media

    - name: Format media SSD partition
      ansible.builtin.filesystem:
        fstype: ext4
        dev: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1-part1
      tags: media

    - name: Read media SSD UUID
      ansible.builtin.command:
        cmd: blkid -s UUID -o value /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1-part1
      register: media_ssd_uuid
      changed_when: false
      check_mode: false
      tags: media

    - name: Create mount point for media SSD
      ansible.builtin.file:
        path: /mnt/media-ssd
        state: directory
      tags: media

    # bind de / para enxergar a pasta por baixo do mount, sem desmontar o SSD
    - name: Make the empty mount point immutable (writes fail if the SSD is not mounted)
      ansible.builtin.shell:
        cmd: |
          set -e
          tmp=$(mktemp -d)
          mount --bind / "$tmp"
          trap 'umount "$tmp"; rmdir "$tmp"' EXIT
          if lsattr -d "$tmp/mnt/media-ssd" | cut -d' ' -f1 | grep -q i; then
            echo unchanged
          else
            chattr +i "$tmp/mnt/media-ssd"
            echo changed
          fi
        executable: /bin/bash
      register: media_ssd_immutable
      changed_when: media_ssd_immutable.stdout == 'changed'
      tags: media

    - name: Mount media SSD persistently
      ansible.posix.mount:
        path: /mnt/media-ssd
        src: "UUID={{ media_ssd_uuid.stdout }}"
        fstype: ext4
        state: mounted
      tags: media
        
  # k3s
    - name: Download and run k3s installation script
      ansible.builtin.shell:
        cmd: curl -fsSL https://get.k3s.io | sh
        creates: /usr/local/bin/k3s  # idempotência: só roda se o binário ainda não existir

    - name: Ensure k3s is running and enabled on boot
      ansible.builtin.service:
        name: k3s
        state: started
        enabled: true     

    - name: Wait for k3s to be ready
      ansible.builtin.wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        timeout: 60

  # argoCD
    - name: Check if ArgoCD namespace exists
      ansible.builtin.command:
        cmd: kubectl get namespace argocd
      register: argocd_namespace
      failed_when: false
      changed_when: false

    - name: Create ArgoCD namespace
      ansible.builtin.command:
        cmd: kubectl create namespace argocd
      when: argocd_namespace.rc != 0

    - name: Install ArgoCD
      ansible.builtin.command:
        cmd: kubectl apply -n argocd --server-side -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
      when: argocd_namespace.rc != 0

  # node exporter
    - name: Install Node Exporter
      ansible.builtin.apt:
        name: prometheus-node-exporter
        state: present

    - name: Ensure Node Exporter is running and enabled on boot
      ansible.builtin.service:
        name: prometheus-node-exporter
        state: started
        enabled: true

  # tailscale
    - name: Download and run Tailscale installation script
      ansible.builtin.shell:
        cmd: curl -fsSL https://tailscale.com/install.sh | sh
        creates: /usr/bin/tailscale  # idempotência: só roda se o binário ainda não existir

    - name: Ensure Tailscale is running and enabled on boot
      ansible.builtin.service:
        name: tailscaled
        state: started
        enabled: true

    - name: Connect to Tailscale with auth key
      ansible.builtin.command:
        cmd: tailscale up --authkey="{{ tailscale_auth_key }}"
      register: tailscale_up
      changed_when: tailscale_up.rc == 0