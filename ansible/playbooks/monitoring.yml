---

- name: Configure lxc-monitoring
  hosts: lxc-monitoring                # hosts do inventory que se aplica
  become: true                         # sudo

  pre_tasks:
    # apt-get update
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600  # só atualiza se o cache tiver mais de 1h

  tasks:
    - name: Install dependencies
      ansible.builtin.apt:
        name:
        - curl
        - wget
        - net-tools
        - unzip
        state: present
      
    # grafana
    - name: Create keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add GPG key for Grafana
      ansible.builtin.get_url:
        url: https://apt.grafana.com/gpg.key
        dest: /etc/apt/keyrings/grafana.asc
        mode: '0644'

    - name: Add Grafana repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/grafana.list
        content: "deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main\n"
        mode: '0644'

    - name: Install Grafana
      ansible.builtin.apt:
        name: grafana
        update_cache: true
        state: present

    - name: Copy Grafana config
      ansible.builtin.template:
        src: templates/grafana.ini.j2
        dest: /etc/grafana/grafana.ini
        owner: grafana
        group: grafana
      notify: Restart Grafana

    # prometheus
    - name: Install Prometheus
      ansible.builtin.apt:
        name: prometheus
        state: present

    # antes do prometheus.yml: o promtool check config abre os rule_files que ele referencia
    - name: Copy Prometheus alert rules
      ansible.builtin.template:
        src: templates/alert.rules.yml.j2
        dest: /etc/prometheus/alert.rules.yml
        owner: prometheus
        group: prometheus
        mode: '0644'
        validate: promtool check rules %s
      notify: Restart Prometheus

    - name: Copy Prometheus config
      ansible.builtin.template:
        src: templates/prometheus.yml.j2
        dest: /etc/prometheus/prometheus.yml
        owner: prometheus
        group: prometheus
        validate: promtool check config %s
      notify: Restart Prometheus

    - name: Set Prometheus retention flags
      ansible.builtin.lineinfile:
        path: /etc/default/prometheus
        regexp: '^ARGS='
        line: 'ARGS="--storage.tsdb.retention.time={{ prometheus_retention_time }} --storage.tsdb.retention.size={{ prometheus_retention_size }}"'
      notify: Restart Prometheus

    # alertmanager
    - name: Install Alertmanager
      ansible.builtin.apt:
        name: prometheus-alertmanager # traz o amtool junto
        state: present

    - name: Copy Alertmanager config
      ansible.builtin.template:
        src: templates/alertmanager.yml.j2
        dest: /etc/prometheus/alertmanager.yml
        owner: prometheus
        group: prometheus
        mode: '0640' # tem o token do bot do Telegram
        validate: amtool check-config %s
      no_log: true # não mostrar o token no diff/saída do Ansible
      notify: Restart Alertmanager

    # nó único: desliga o gossip de cluster (porta 9094), que não tem uso aqui
    - name: Set Alertmanager flags
      ansible.builtin.lineinfile:
        path: /etc/default/prometheus-alertmanager
        regexp: '^ARGS='
        line: 'ARGS="--cluster.listen-address="'
      notify: Restart Alertmanager

    # loki
    - name: Create Loki user
      ansible.builtin.user:
        name: loki
        system: true # usuário de sistema (UID baixo, sem home directory)
        shell: /bin/false # impede login direto

    - name: Download Loki binary
      ansible.builtin.get_url:
        url: "https://github.com/grafana/loki/releases/download/v{{ loki_version }}/loki-linux-amd64.zip"
        # versão no nome: com um nome fixo, o get_url não baixa de novo quando o loki_version muda
        dest: "/tmp/loki-{{ loki_version }}.zip"

    - name: Unzip Loki binary
      ansible.builtin.unarchive:
        src: "/tmp/loki-{{ loki_version }}.zip"
        dest: /usr/local/bin/
        remote_src: true
        mode: '0755'
      notify: Restart Loki

    - name: Create Loki symlink
      ansible.builtin.file:
        src: /usr/local/bin/loki-linux-amd64
        dest: /usr/local/bin/loki
        state: link

    - name: Create data directorys for Loki
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: loki
        group: loki
      loop:
        - /etc/loki
        - /var/loki/index
        - /var/loki/cache
        - /var/loki/chunks
        - /var/loki/wal
        - /var/loki/compactor

    - name: Copy Loki config
      ansible.builtin.template:
        src: templates/loki-config.j2
        dest: /etc/loki/config.yml
        owner: loki
        group: loki
      notify: Restart Loki

    - name: Create Loki service on systemd
      ansible.builtin.template:
        src: templates/loki.service.j2
        dest: /etc/systemd/system/loki.service
      notify: Enable and start Loki

    - name: Ensure services are running and enabled on boot
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
      - grafana-server
      - prometheus
      - prometheus-alertmanager
      - loki

  # node exporter
    - name: Install Node Exporter
      ansible.builtin.apt:
        name: prometheus-node-exporter
        state: present

    - name: Ensure Node Exporter is running and enabled on boot
      ansible.builtin.service:
        name: prometheus-node-exporter
        state: started
        enabled: true

    # tailscale
    - name: Download and run Tailscale installation script
      ansible.builtin.shell:
        cmd: curl -fsSL https://tailscale.com/install.sh | sh
        creates: /usr/bin/tailscale

    - name: Ensure Tailscale is running and enabled on boot
      ansible.builtin.service:
        name: tailscaled
        state: started
        enabled: true

    - name: Connect to Tailscale with auth key
      ansible.builtin.command:
        cmd: tailscale up --authkey="{{ tailscale_auth_key }}"
      register: tailscale_up
      changed_when: tailscale_up.rc == 0

  handlers:
    - name: Enable and start Loki
      ansible.builtin.systemd:
        name: loki
        state: started
        enabled: true
        daemon_reload: true

    - name: Restart Loki
      ansible.builtin.service:
        name: loki
        state: restarted

    - name: Restart Prometheus
      ansible.builtin.service:
        name: prometheus
        state: restarted

    - name: Restart Alertmanager
      ansible.builtin.service:
        name: prometheus-alertmanager
        state: restarted

    - name: Restart Grafana
      ansible.builtin.service:
        name: grafana-server
        state: restarted 